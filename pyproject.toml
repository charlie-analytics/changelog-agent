[project]
name = "changelog-agent"
version = "0.1.0"
description = "Turn git history into polished release notes. Works offline; optional Claude polish."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
changelog-agent = "changelog_agent.cli:main"
changelog-agent-ui = "changelog_agent.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
changelog_agent = ["ui.html"]
